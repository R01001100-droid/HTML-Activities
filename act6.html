<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif;
     }
        .gant {
            display: flex;
            width: 600px;
            border: 1px solid #000;
        }
        .chart {
            flex: 1px; 
            text-align: center;
            padding: 10px;
            border-right: 1px solid #000;
            font-weight: bold; 
        }
        
        .ganttt {
            display: flex;
            width: 610px;
            justify-content: space-between;
            margin-top: 5px;
            font-weight: bold;
            
        }

        table {
            border-collapse: collapse;
            width: 600px;
            margin-top: 25px;
            text-align: center;
        }
        th, td { border: 1px solid #000; padding: 8px; }
    </style>
</head>
<body>

    <h3>Gantt Chart</h3>
    <div class="gant">
        <div class="chart">Idle</div>
        <div class="chart">P1</div>
        <div class="chart">P2</div>
        <div class="chart">P3</div>
        <div class="chart">P5</div>
        <div class="chart">P4</div>
    </div>
    <div class="ganttt">
        <span>0</span>
        <span>3</span>
        <span>8</span>
        <span>10</span>
        <span>14</span>
        <span>31</span>
        <span>34</span>
    </div>

    <h3>Process Table</h3>
    <table>
        <tr>
            <th>Process</th>
            <th>AT</th>
            <th>BT</th>
            <th>CT</th>
            <th>TAT</th>
            <th>WT</th>
        </tr>
        <tr><td>P1</td><td>3</td><td>5</td><td>8</td><td>5</td><td>0</td></tr>
        <tr><td>P2</td><td>4</td><td>2</td><td>10</td><td>6</td><td>4</td></tr>
        <tr><td>P3</td><td>6</td><td>4</td><td>14</td><td>8</td><td>4</td></tr>
        <tr><td>P4</td><td>16</td><td>3</td><td>34</td><td>18</td><td>15</td></tr>
        <tr><td>P5</td><td>7</td><td>17</td><td>31</td><td>24</td><td>7</td></tr>
        <tr>
            <th colspan="4">TOTAL</th>
            <th>61</th>
            <th>30</th>
        </tr>
        <tr>
            <th colspan="4">AVERAGE</th>
            <th>12.2</th>
            <th>7.5</th>
        </tr>
    </table>

</body>
</html>
